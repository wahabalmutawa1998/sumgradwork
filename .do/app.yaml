# DigitalOcean App Platform — مواصفة النشر
# سيرفر Node + قاعدة بيانات Postgres عشان البيانات مشتركة بين كل الفريق.
# تُستخدم تلقائياً عند إنشاء التطبيق من هذا الريبو، أو يدوياً عبر:
#   doctl apps create --spec .do/app.yaml
name: sumgradwork
region: fra
services:
  - name: web
    github:
      repo: wahabalmutawa1998/sumgradwork
      branch: main
      deploy_on_push: true
    source_dir: /
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
databases:
  - name: db
    engine: PG
    production: false
